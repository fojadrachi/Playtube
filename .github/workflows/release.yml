name: Release

# Baut Playtube (Rust) und veröffentlicht das Setup als GitHub-Release, sobald ein
# Tag "vX.Y.Z" gepusht wird. Die App sucht Updates über /releases/latest und lädt
# "Playtube-Setup-<Version>.exe" (src/updater.rs); GitHub liefert dazu die SHA-256-Prüfsumme.
# Der Titel "Playtube vX.Y.Z" lässt auch die alte Python-Version (1.0.0) das Update finden.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: cargo test --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Bauen
        shell: pwsh
        run: .\build-release.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          gh release delete $tag --repo "${{ github.repository }}" --yes 2>$null
          gh release create $tag "dist\Playtube-Setup-$version.exe" `
            --repo "${{ github.repository }}" --title "Playtube $tag" --notes-file release_notes.md --latest --verify-tag
