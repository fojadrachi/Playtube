name: Release

# Baut Playtube (Rust) und veröffentlicht das Setup als GitHub-Release, sobald ein
# Tag "vX.Y.Z" gepusht wird. Die App sucht Updates über /releases/latest und lädt
# "Playtube-Setup-<Version>.exe" (src/updater.rs); GitHub liefert dazu die SHA-256-Prüfsumme.
# Kleine Updates (gleiche Hauptversion) nehmen stattdessen "Playtube-<Version>-win64.exe" und
# tauschen sie ohne Setup gegen die laufende Datei (gilt ab dem nächsten Start).
# Der Titel "Playtube vX.Y.Z" lässt auch die alte Python-Version (1.0.0) das Update finden.
# Linux (x86_64): "playtube_<Version>_amd64.deb" und "Playtube-<Version>-x86_64.AppImage"
# (build-linux.sh); das AppImage aktualisiert sich darüber selbst.
#
# Windows wird normalerweise lokal gebaut (release-local.ps1: Tests, Setup, Tag, Release mit den
# Windows-Dateien). Dieser Workflow baut dann nur Linux und hängt die Dateien an dasselbe Release.
# Den Windows-Build hier gibt es weiter als Rückfall: von Hand starten mit „windows“ = true.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows auch hier bauen (statt lokal mit release-local.ps1)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: cargo test --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Bauen
        shell: pwsh
        run: .\build-release.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Dateien ablegen
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Playtube-Setup-*.exe
            dist/Playtube-*-win64.exe
          if-no-files-found: error

  build-linux:
    # 22.04: läuft dann auch auf älteren Distributionen (glibc 2.35) mit WebKitGTK 4.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libxkbcommon-dev

      - name: Tests
        run: cargo test --locked

      - name: Bauen (.deb und AppImage)
        run: ./build-linux.sh

      - name: Dateien ablegen
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    # Läuft auch, wenn der Windows-Build hier übersprungen wurde (lokal gebaut).
    if: always() && needs.build-linux.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          files=()
          for f in "dist/Playtube-Setup-$version.exe" "dist/Playtube-$version-win64.exe" "dist/playtube_${version}_amd64.deb" "dist/Playtube-$version-x86_64.AppImage"; do
            [ -f "$f" ] && files+=("$f")
          done
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release gibt es schon (Windows lokal veröffentlicht): Dateien anhängen.
            gh release upload "$tag" "${files[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "${{ github.repository }}" --title "Playtube $tag" --notes-file release_notes.md --latest --verify-tag
          fi
