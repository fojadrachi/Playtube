name: Tests

# Unit-Tests bei jedem Push und Pull Request - unter Windows (wie bisher) und Linux.

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --locked

  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libxkbcommon-dev
      - name: Bauen
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
