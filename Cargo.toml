[package]
name = "playtube"
version = "2.5.2"
edition = "2024"
description = "Playtube – YouTube und YouTube Music als eigene Desktop-App"
license = "UNLICENSED"
publish = false

[[bin]]
# Wird beim Release zu "Playtube.exe" (siehe build-release.ps1)
name = "playtube"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
discord-rich-presence = "1.1.0"
futures-util = "0.3"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5.4.5"
qrcode = { version = "0.14", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.11.1"
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tray-icon = "0.26.1"
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
wry = "0.57.1"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
